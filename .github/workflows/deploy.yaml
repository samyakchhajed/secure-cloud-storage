name: Deploy Secure Cloud Storage to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment tier'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      aws_region:
        description: 'Target AWS deployment region'
        required: true
        default: 'ap-south-1'
        type: string

permissions:
  id-token: write   # Required for requesting the OIDC JWT from GitHub
  contents: read    # Required for actions/checkout

jobs:
  deploy:
    name: Provision Infrastructure & Deploy App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Debug - Decode OIDC token claims
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region || 'ap-south-1' }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Ensure Remote State Backend Exists (S3 + DynamoDB Lock)
        id: state-backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ inputs.aws_region || 'ap-south-1' }}"
          STATE_BUCKET="scs-tfstate-${ACCOUNT_ID}-${REGION}"
          LOCK_TABLE="scs-tfstate-lock"

          echo "Checking S3 state bucket: ${STATE_BUCKET}..."
          if aws s3api head-bucket --bucket "${STATE_BUCKET}" 2>/dev/null; then
            echo "State bucket ${STATE_BUCKET} already exists. Skipping creation."
          else
            echo "Creating state bucket ${STATE_BUCKET}..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "$REGION"
            else
              aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "${STATE_BUCKET}" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "${STATE_BUCKET}" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "${STATE_BUCKET}" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi

          echo "Checking DynamoDB lock table: ${LOCK_TABLE}..."
          if aws dynamodb describe-table --table-name "${LOCK_TABLE}" --region "$REGION" >/dev/null 2>&1; then
            echo "Lock table ${LOCK_TABLE} already exists. Skipping creation."
          else
            echo "Creating lock table ${LOCK_TABLE}..."
            aws dynamodb create-table \
              --table-name "${LOCK_TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            aws dynamodb wait table-exists --table-name "${LOCK_TABLE}" --region "$REGION"
          fi

          echo "state_bucket=${STATE_BUCKET}" >> $GITHUB_OUTPUT
          echo "lock_table=${LOCK_TABLE}" >> $GITHUB_OUTPUT

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Terraform Init & Validate
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ steps.state-backend.outputs.state_bucket }}" \
            -backend-config="key=secure-cloud-storage/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region || 'ap-south-1' }}" \
            -backend-config="dynamodb_table=${{ steps.state-backend.outputs.lock_table }}"
          terraform validate

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve -input=false \
            -var="aws_region=${{ inputs.aws_region || 'ap-south-1' }}" \
            -var="environment=${{ inputs.environment }}"

      - name: Deploy Frontend to S3 & Invalidate CloudFront
        run: |
          cd terraform
          API_URL=$(terraform output -raw api_gateway_url)
          SITE_BUCKET=$(terraform output -raw s3_frontend_bucket)
          CF_DIST_ID=""
          WEB_URL=$(terraform output -raw website_url)
          cd ..

          echo "Configuring runtime API URL: ${API_URL}"
          echo "window.API_BASE_URL = '${API_URL}';" > frontend/config.js

          echo "Syncing frontend static assets to s3://${SITE_BUCKET}..."
          aws s3 sync frontend/ s3://${SITE_BUCKET} --delete

          if [ -n "${CF_DIST_ID}" ]; then
            echo "Creating CloudFront CDN cache invalidation..."
            aws cloudfront create-invalidation --distribution-id ${CF_DIST_ID} --paths "/*"
          else
            echo "Skipping CloudFront cache invalidation (Direct S3 Static Website Hosting active)."
          fi

          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Web Application** | [${WEB_URL}](${WEB_URL}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Gateway** | \`${API_URL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | \`${{ inputs.aws_region || 'ap-south-1' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
